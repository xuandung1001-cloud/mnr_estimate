<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MNR Survey</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --blue: #185FA5;
  --blue-light: #E6F1FB;
  --green: #2D7A3A;
  --green-light: #EAF3DE;
  --red: #C0392B;
  --red-light: #FCEBEB;
  --amber: #B7610A;
  --amber-light: #FDF3E3;
  --gray: #6B7280;
  --border: #E5E7EB;
  --bg: #F3F4F6;
  --white: #FFFFFF;
  --text: #1F2937;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 40px;
}

/* LOGIN */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

.login-box {
  background: white;
  border-radius: 20px;
  padding: 36px 28px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.login-logo {
  text-align: center;
  margin-bottom: 28px;
}

.login-logo .app-name {
  font-size: 22px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: -0.5px;
}

.login-logo .app-sub {
  font-size: 12px;
  color: var(--gray);
  margin-top: 2px;
}

.login-logo .survey-badge {
  display: inline-block;
  background: var(--blue-light);
  color: var(--blue);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  margin-top: 6px;
}

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 13px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus { border-color: var(--blue); }

.btn-login {
  width: 100%;
  padding: 14px;
  background: var(--blue);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 4px;
}

.btn-login:active { opacity: 0.8; }
.login-err { color: var(--red); font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; }

/* MAIN APP */
#app { display: none; }

/* TOPBAR */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--blue);
  color: white;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.topbar-title { font-size: 16px; font-weight: 700; }
.topbar-user { font-size: 11px; opacity: 0.8; }
.btn-logout {
  background: rgba(255,255,255,0.15);
  border: none;
  color: white;
  font-size: 11px;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
}

/* CONTENT */
.content { padding: 16px; }

/* CONT INPUT */
.cont-card {
  background: white;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.cont-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.cont-input-row {
  display: flex;
  gap: 8px;
}

.cont-input {
  flex: 1;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  text-transform: uppercase;
  outline: none;
  letter-spacing: 1px;
}

.cont-input:focus { border-color: var(--blue); }

.btn-set {
  padding: 12px 18px;
  background: var(--blue);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

/* CONT INFO */
.cont-info {
  display: none;
  margin-top: 12px;
  padding: 10px 12px;
  background: var(--blue-light);
  border-radius: 8px;
  font-size: 12px;
}

.cont-info-row { display: flex; gap: 16px; flex-wrap: wrap; }
.cont-info-item { }
.cont-info-item .label { color: var(--gray); font-size: 10px; }
.cont-info-item .value { font-weight: 600; color: var(--blue); }

/* CAMERA SECTION */
.camera-card {
  background: white;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  display: none;
}

.camera-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.camera-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}

.photo-counter {
  font-size: 12px;
  color: var(--gray);
  background: var(--bg);
  padding: 3px 10px;
  border-radius: 20px;
}

/* BIG CAPTURE BUTTON */
.capture-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.btn-capture {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--blue);
  border: 4px solid white;
  box-shadow: 0 0 0 3px var(--blue), 0 4px 16px rgba(24,95,165,0.4);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s;
}

.btn-capture:active { transform: scale(0.92); }

.btn-capture svg { width: 32px; height: 32px; fill: white; }

.btn-gallery {
  padding: 10px 20px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  width: 100%;
}

input[type="file"] { display: none; }

/* PHOTO GRID */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.photo-item {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg);
}

.photo-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-item .del-btn {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 22px;
  height: 22px;
  background: rgba(0,0,0,0.6);
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.photo-item .status-badge {
  position: absolute;
  bottom: 4px;
  left: 4px;
  right: 4px;
  text-align: center;
  font-size: 9px;
  font-weight: 600;
  padding: 2px 4px;
  border-radius: 4px;
}

.status-uploading { background: rgba(255,193,7,0.9); color: #000; }
.status-done      { background: rgba(46,160,67,0.9); color: #fff; }
.status-error     { background: rgba(192,57,43,0.9); color: #fff; }

/* PROGRESS */
.upload-progress {
  display: none;
  background: var(--amber-light);
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 12px;
}

.progress-text {
  font-size: 12px;
  font-weight: 600;
  color: var(--amber);
  margin-bottom: 6px;
}

.progress-bar-wrap {
  background: rgba(0,0,0,0.1);
  border-radius: 4px;
  height: 5px;
}

.progress-bar {
  background: var(--amber);
  height: 5px;
  border-radius: 4px;
  width: 0%;
  transition: width 0.3s;
}

/* DRIVE LINK */
.drive-link {
  display: none;
  background: var(--green-light);
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 12px;
  text-align: center;
}

.drive-link a {
  color: var(--green);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1F2937;
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.3s;
  z-index: 1000;
  white-space: nowrap;
  max-width: 90vw;
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="app-name">MNR Estimate</div>
      <div class="app-sub">Cảng Thạnh Phước</div>
      <div class="survey-badge">📷 Survey Mode</div>
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="login-user" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Key</label>
      <input type="password" id="login-pass" placeholder="••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()">Đăng nhập</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">📷 Survey Upload</div>
      <div class="topbar-user" id="topbar-user">—</div>
    </div>
    <button class="btn-logout" onclick="doLogout()">Đăng xuất</button>
  </div>

  <!-- TABS -->
  <div style="display:flex;background:white;border-bottom:1px solid var(--border)">
    <button id="tab-upload" onclick="switchTab('upload')"
      style="flex:1;padding:12px;border:none;background:none;font-size:13px;font-weight:600;color:var(--blue);border-bottom:2px solid var(--blue);cursor:pointer">
      📷 Upload
    </button>
    <button id="tab-view" onclick="switchTab('view')"
      style="flex:1;padding:12px;border:none;background:none;font-size:13px;font-weight:600;color:var(--gray);border-bottom:2px solid transparent;cursor:pointer">
      🖼 Xem ảnh
    </button>
  </div>

  <!-- UPLOAD TAB -->
  <div id="pane-upload" class="content">

    <!-- CONT INPUT -->
    <div class="cont-card">
      <div class="cont-label">Số Container</div>
      <div class="cont-input-row">
        <input type="text" class="cont-input" id="cont-no"
          placeholder="CAIU1234567"
          maxlength="11"
          oninput="this.value=this.value.toUpperCase()"
          onkeydown="if(event.key==='Enter') setCont()">
        <button class="btn-set" onclick="setCont()">OK</button>
      </div>

      <!-- Carrier + Loại ảnh -->
      <div style="display:flex;gap:8px;margin-top:10px">
        <div style="flex:1">
          <div class="cont-label" style="margin-bottom:4px">Carrier</div>
          <select id="sel-carrier" class="cont-input" style="font-size:14px;font-weight:600;padding:10px 12px">
            <option value="">-- Chọn --</option>
          </select>
        </div>
        <div style="flex:1">
          <div class="cont-label" style="margin-bottom:4px">Loại ảnh</div>
          <select id="sel-type" class="cont-input" style="font-size:13px;font-weight:600;padding:10px 12px">
            <option value="Trước sửa chữa">Trước sửa chữa</option>
            <option value="Sau sửa chữa">Sau sửa chữa</option>
          </select>
        </div>
      </div>

      <div class="cont-info" id="cont-info">
        <div class="cont-info-row">
          <div class="cont-info-item">
            <div class="label">SIZE</div>
            <div class="value" id="info-size">—</div>
          </div>
          <div class="cont-info-item">
            <div class="label">GRADE</div>
            <div class="value" id="info-grade">—</div>
          </div>
          <div class="cont-info-item">
            <div class="label">STATUS</div>
            <div class="value" id="info-status">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- CAMERA -->
    <div class="camera-card" id="camera-card">
      <div class="camera-header">
        <div class="camera-title" id="camera-title">Ảnh Survey — Trước sửa chữa</div>
        <div class="photo-counter" id="photo-counter">0 ảnh</div>
      </div>

      <div class="capture-area">
        <button class="btn-capture" onclick="document.getElementById('cam-input').click()" title="Chụp ảnh">
          <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/><path d="M9 3L7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
        </button>
        <button class="btn-gallery" onclick="document.getElementById('gallery-input').click()">
          📁 Chọn từ thư viện
        </button>
      </div>

      <!-- Hidden file inputs -->
      <input type="file" id="cam-input" accept="image/*" capture="environment" onchange="handleFiles(this)">
      <input type="file" id="gallery-input" accept="image/*" multiple onchange="handleFiles(this)">

      <!-- Photo grid -->
      <div class="photo-grid" id="photo-grid"></div>

      <!-- Upload progress -->
      <div class="upload-progress" id="upload-progress">
        <div class="progress-text" id="progress-text">Đang upload...</div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>

      <!-- Drive link -->
      <div class="drive-link" id="drive-link">
        <a id="drive-link-a" href="#" target="_blank">📂 Mở thư mục Drive</a>
      </div>
    </div>

  </div><!-- end pane-upload -->

  <!-- VIEW TAB -->
  <div id="pane-view" class="content" style="display:none">
    <div class="cont-card">
      <div class="cont-label">Tìm ảnh theo số Container</div>
      <div class="cont-input-row">
        <input type="text" class="cont-input" id="view-cont-no"
          placeholder="CAIU1234567"
          maxlength="11"
          oninput="this.value=this.value.toUpperCase()"
          onkeydown="if(event.key==='Enter') loadViewPhotos()">
        <select id="view-carrier" class="cont-input" style="font-size:13px;font-weight:500;padding:10px 10px;max-width:100px">
          <option value="">Carrier</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn-set" style="flex:1;border-radius:10px" onclick="loadViewPhotos()">Tải ảnh</button>
      </div>
    </div>

    <!-- Loại ảnh tabs -->
    <div style="display:flex;gap:8px;padding:0 0 12px 0" id="view-type-tabs">
      <button onclick="switchViewType('Trước sửa chữa', this)"
        style="flex:1;padding:9px;border:1.5px solid var(--blue);background:var(--blue);color:white;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer">
        Trước SC
      </button>
      <button onclick="switchViewType('Sau sửa chữa', this)"
        style="flex:1;padding:9px;border:1.5px solid var(--border);background:white;color:var(--gray);border-radius:10px;font-size:12px;font-weight:600;cursor:pointer">
        Sau SC
      </button>
    </div>

    <div id="view-results"></div>

    <!-- Nút bổ sung ảnh (chỉ hiện khi đã có kết quả) -->
    <div id="view-add-bar" style="display:none;margin-top:12px">
      <div style="display:flex;gap:8px">
        <button onclick="document.getElementById('view-cam-input').click()"
          style="flex:1;padding:12px;background:var(--blue);color:white;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer">
          📷 Chụp thêm
        </button>
        <button onclick="document.getElementById('view-gallery-input').click()"
          style="flex:1;padding:12px;background:white;color:var(--blue);border:1.5px solid var(--blue);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer">
          📁 Chọn từ thư viện
        </button>
      </div>
      <div id="view-upload-status" style="display:none;margin-top:8px;padding:10px 12px;background:var(--amber-light);border-radius:8px;font-size:12px;font-weight:600;color:var(--amber);text-align:center"></div>
    </div>

    <!-- Hidden inputs cho view tab -->
    <input type="file" id="view-cam-input" accept="image/*" capture="environment" onchange="handleViewFiles(this)">
    <input type="file" id="view-gallery-input" accept="image/*" multiple onchange="handleViewFiles(this)">

  </div><!-- end pane-view -->

</div><!-- end app -->

<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzZQ22ErS32LJV8dS0dVKGG3d6fhDlQxupeYQREb4pbbWjXnmHxoMPWFXNBcQmj4DmtaQ/exec';

var state = { user: null, stock: [], carriers: [], contNo: '', carrier: '', loaiAnh: 'Trước sửa chữa', photos: [] };

// ===================== API =====================
async function apiGet(params) {
  var url = API + '?' + new URLSearchParams(params);
  var res = await fetch(url);
  var text = await res.text();
  try { return JSON.parse(text); } catch(e) { return { success: false, error: e.message }; }
}

async function apiPost(data) {
  var res = await fetch(API, { method: 'POST', body: JSON.stringify(data) });
  var text = await res.text();
  try { return JSON.parse(text); } catch(e) { return { success: false, error: e.message }; }
}

// ===================== TOAST =====================
function toast(msg, dur) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, dur || 2500);
}

// ===================== LOGIN =====================
window.addEventListener('load', function() {
  try {
    var saved = localStorage.getItem('mnr_session');
    if (saved) {
      var session = JSON.parse(saved);
      if (session && session.expiry) {
        var parts = session.expiry.split('/');
        var expiry = new Date(parts[2] + '-' + parts[1] + '-' + parts[0]);
        expiry.setHours(23,59,59,0);
        if (new Date() <= expiry) {
          state.user = session;
          showApp();
          return;
        }
      }
    }
  } catch(e) {}
  localStorage.removeItem('mnr_session');
});

async function doLogin() {
  var user = document.getElementById('login-user').value.trim();
  var pass = document.getElementById('login-pass').value.trim();
  if (!user || !pass) { document.getElementById('login-err').textContent = 'Nhập đủ thông tin!'; return; }
  document.getElementById('login-err').textContent = 'Đang đăng nhập...';
  try {
    var res = await apiPost({ action: 'login', username: user, password: pass });
    if (res.success) {
      state.user = res.user;
      localStorage.setItem('mnr_session', JSON.stringify(res.user));
      showApp();
    } else {
      document.getElementById('login-err').textContent = res.error || 'Sai thông tin đăng nhập';
    }
  } catch(e) {
    document.getElementById('login-err').textContent = 'Lỗi kết nối: ' + e.message;
  }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('topbar-user').textContent = state.user.fullname || state.user.username;
  // Load stock
  apiGet({ action: 'getEmtyStock' }).then(function(res) {
    if (res.success) state.stock = res.data;
  });
  // Load carriers từ tariff
  apiGet({ action: 'getTariff' }).then(function(res) {
    if (res.success && res.data.length) {
      var carriers = [];
      res.data.forEach(function(r) {
        if (r.carrier && carriers.indexOf(r.carrier) === -1) carriers.push(r.carrier);
      });
      carriers.sort();
      state.carriers = carriers;
      var sel = document.getElementById('sel-carrier');
      carriers.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        sel.appendChild(opt);
      });
    }
  });
}

function doLogout() {
  localStorage.removeItem('mnr_session');
  location.reload();
}

// ===================== TABS =====================
var currentTab = 'upload';
var currentViewType = 'Trước sửa chữa';

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('pane-upload').style.display = tab === 'upload' ? 'block' : 'none';
  document.getElementById('pane-view').style.display   = tab === 'view'   ? 'block' : 'none';

  document.getElementById('tab-upload').style.color       = tab === 'upload' ? 'var(--blue)' : 'var(--gray)';
  document.getElementById('tab-upload').style.borderBottom= tab === 'upload' ? '2px solid var(--blue)' : '2px solid transparent';
  document.getElementById('tab-view').style.color         = tab === 'view'   ? 'var(--blue)' : 'var(--gray)';
  document.getElementById('tab-view').style.borderBottom  = tab === 'view'   ? '2px solid var(--blue)' : '2px solid transparent';

  // Sync carrier dropdown
  if (tab === 'view') syncViewCarriers();
}

function syncViewCarriers() {
  var sel = document.getElementById('view-carrier');
  var current = sel.value;
  sel.innerHTML = '<option value="">Carrier</option>';
  state.carriers.forEach(function(c) {
    var opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    if (c === current) opt.selected = true;
    sel.appendChild(opt);
  });
}

function switchViewType(type, btn) {
  currentViewType = type;
  var btns = document.querySelectorAll('#view-type-tabs button');
  btns.forEach(function(b) {
    b.style.background   = 'white';
    b.style.color        = 'var(--gray)';
    b.style.borderColor  = 'var(--border)';
  });
  btn.style.background  = 'var(--blue)';
  btn.style.color       = 'white';
  btn.style.borderColor = 'var(--blue)';
  // Reload nếu đang có kết quả
  var contNo = document.getElementById('view-cont-no').value.trim().toUpperCase();
  if (contNo.length > 3) loadViewPhotos();
}

// ===================== VIEW PHOTOS =====================
async function loadViewPhotos() {
  var contNo  = document.getElementById('view-cont-no').value.trim().toUpperCase();
  var carrier = document.getElementById('view-carrier').value;
  if (contNo.length < 4) { toast('Nhập số container!'); return; }
  if (!carrier)           { toast('Chọn Carrier!'); return; }

  var res_div = document.getElementById('view-results');
  res_div.innerHTML = '<div style="text-align:center;padding:30px;color:var(--gray)">Đang tải...</div>';

  try {
    var res = await apiGet({
      action:       'getPhotosByFolder',
      container_no: contNo,
      carrier:      carrier,
      loai_anh:     currentViewType
    });

    if (!res.success) {
      res_div.innerHTML = '<div style="text-align:center;padding:20px;color:var(--red);font-size:13px">Lỗi: ' + (res.error || 'Unknown') + '</div>';
      document.getElementById('view-add-bar').style.display = 'none';
      return;
    }

    if (!res.photos || !res.photos.length) {
      res_div.innerHTML = '<div style="text-align:center;padding:30px;color:var(--gray);font-size:13px">Chưa có ảnh nào</div>';
      document.getElementById('view-add-bar').style.display = 'block';
      return;
    }

    // Hiện add bar
    document.getElementById('view-add-bar').style.display = 'block';
    document.getElementById('view-upload-status').style.display = 'none';

    // Render grid
    var html = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">';
    res.photos.forEach(function(p) {
      html += '<div style="position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg)" id="vphoto-' + p.id + '">';
      html += '<a href="' + p.url + '" target="_blank"><img src="' + p.thumb + '" style="width:100%;height:100%;object-fit:cover" loading="lazy"></a>';
      html += '<button id="delbtn-' + p.id + '" style="position:absolute;top:4px;right:4px;width:24px;height:24px;background:rgba(192,57,43,0.85);border:none;border-radius:50%;color:white;font-size:13px;cursor:pointer">×</button>';
      html += '<div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.45);color:#fff;font-size:8px;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + p.name + '</div>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div style="text-align:center;margin-top:10px;font-size:11px;color:var(--gray)">' + res.photos.length + ' ảnh — ' + contNo + ' / ' + carrier + ' / ' + currentViewType + '</div>';
    res_div.innerHTML = html;
    // Attach delete buttons using stored IDs
    res.photos.forEach(function(p) {
      var btn = document.getElementById('delbtn-' + p.id);
      if (btn) {
        (function(fid) {
          btn.onclick = function() { deletePhoto(fid); };
        })(p.id);
      }
    });

  } catch(e) {
    res_div.innerHTML = '<div style="color:var(--red);font-size:12px;padding:16px">Lỗi: ' + e.message + '</div>';
  }
}

async function deletePhoto(fileId) {
  if (!confirm('Xoá ảnh này?')) return;
  try {
    var res = await apiPost({ action: 'deletePhoto', file_id: fileId });
    if (res.success) {
      var el = document.getElementById('vphoto-' + fileId);
      if (el) { el.style.opacity = '0.3'; el.style.pointerEvents = 'none'; }
      toast('Đã xoá ảnh');
    } else {
      toast('Lỗi: ' + (res.error || 'Unknown'));
    }
  } catch(e) {
    toast('Lỗi: ' + e.message);
  }
}

// ===================== VIEW TAB - BỔ SUNG ẢNH =====================
function handleViewFiles(input) {
  var files = Array.from(input.files);
  if (!files.length) return;

  var contNo  = document.getElementById('view-cont-no').value.trim().toUpperCase();
  var carrier = document.getElementById('view-carrier').value;
  if (!contNo || !carrier) { toast('Chọn Container và Carrier trước!'); return; }

  var statusEl = document.getElementById('view-upload-status');
  statusEl.style.display = 'block';
  statusEl.textContent = 'Đang xử lý ' + files.length + ' ảnh...';

  var today = new Date();
  var dd    = String(today.getDate()).padStart(2,'0');
  var mm    = String(today.getMonth()+1).padStart(2,'0');
  var yyyy  = today.getFullYear();
  var dateStr = dd + mm + yyyy;

  var processed = 0;
  var queue = [];

  files.forEach(function(file) {
    resizeImage(file, 1200, 0.8, function(base64, dataUrl) {
      queue.push({ name: file.name || ('photo_' + Date.now() + '.jpg'), base64: base64, mime: file.type || 'image/jpeg' });
      processed++;
      if (processed === files.length) {
        uploadViewSequential(queue, 0, dateStr, contNo, carrier, function(doneCount, errCount) {
          var msg = '✓ Upload xong ' + doneCount + '/' + queue.length + ' ảnh';
          if (errCount) msg += ' (' + errCount + ' lỗi)';
          statusEl.textContent = msg;
          // Reload lại grid
          setTimeout(function() { loadViewPhotos(); }, 1000);
        });
      }
    });
  });
  input.value = '';
}

async function uploadViewSequential(list, i, dateStr, contNo, carrier, onDone) {
  var done = 0, err = 0;
  for (var j = 0; j < list.length; j++) {
    var item = list[j];
    var statusEl = document.getElementById('view-upload-status');
    if (statusEl) statusEl.textContent = 'Đang upload ' + (j+1) + '/' + list.length + '...';
    try {
      var res = await apiPost({
        action:       'uploadImage',
        container_no: contNo,
        carrier:      carrier,
        loai_anh:     currentViewType,
        date_str:     dateStr,
        file_name:    item.name,
        base64:       item.base64,
        mime_type:    item.mime
      });
      if (res.success) done++; else err++;
    } catch(e) { err++; }
  }
  if (onDone) onDone(done, err);
}

function setCont() {
  var val     = document.getElementById('cont-no').value.trim().toUpperCase();
  var carrier = document.getElementById('sel-carrier').value;
  var loai    = document.getElementById('sel-type').value;

  if (val.length < 4)  { toast('Nhập số container!'); return; }
  if (!carrier)        { toast('Chọn Carrier!'); return; }

  state.contNo  = val;
  state.carrier = carrier;
  state.loaiAnh = loai;
  state.photos  = [];

  document.getElementById('photo-grid').innerHTML = '';
  document.getElementById('photo-counter').textContent = '0 ảnh';
  document.getElementById('drive-link').style.display = 'none';
  document.getElementById('upload-progress').style.display = 'none';
  document.getElementById('camera-title').textContent = 'Ảnh Survey — ' + loai;

  // Lookup stock
  var si = state.stock.find(function(r) {
    return (r.equipment_no || '').toUpperCase() === val;
  });
  if (si) {
    document.getElementById('info-size').textContent   = si.size_type || '—';
    document.getElementById('info-grade').textContent  = si.grade || '—';
    document.getElementById('info-status').textContent = si.container_status || '—';
    document.getElementById('cont-info').style.display = 'block';
  } else {
    document.getElementById('cont-info').style.display = 'none';
  }

  document.getElementById('camera-card').style.display = 'block';
  toast(val + ' — ' + carrier + ' — ' + loai);
}

// ===================== PHOTOS =====================
function handleFiles(input) {
  var files = Array.from(input.files);
  if (!files.length) return;
  toast('Đang xử lý ' + files.length + ' ảnh...');

  var processed = 0;
  var pendingPhotos = [];

  files.forEach(function(file) {
    resizeImage(file, 1200, 0.8, function(base64, dataUrl) {
      var photo = {
        name:    file.name || ('photo_' + Date.now() + '.jpg'),
        base64:  base64,
        mime:    file.type || 'image/jpeg',
        dataUrl: dataUrl,
        status:  'pending'
      };
      state.photos.push(photo);
      var idx2 = state.photos.length - 1;
      renderPhoto(photo, idx2);
      updateCounter();
      pendingPhotos.push({ photo: photo, idx: idx2 });
      processed++;
      if (processed === files.length) {
        toast('Đã load xong, đang upload tuần tự...');
        uploadSequential(pendingPhotos, 0);
      }
    });
  });
  input.value = '';
}

async function uploadSequential(list, i) {
  if (i >= list.length) return;
  await uploadPhoto(list[i].photo, list[i].idx);
  uploadSequential(list, i + 1);
}

function resizeImage(file, maxSize, quality, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', quality);
      callback(dataUrl.split(',')[1], dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderPhoto(photo, idx) {
  var grid = document.getElementById('photo-grid');
  var div = document.createElement('div');
  div.className = 'photo-item';
  div.id = 'photo-item-' + idx;
  div.innerHTML =
    '<img src="' + photo.dataUrl + '">' +
    '<button class="del-btn" onclick="removePhoto(' + idx + ')">×</button>' +
    '<div class="status-badge status-uploading" id="badge-' + idx + '">Đang upload</div>';
  grid.appendChild(div);
}

function updateCounter() {
  document.getElementById('photo-counter').textContent = state.photos.length + ' ảnh';
}

function removePhoto(idx) {
  var el = document.getElementById('photo-item-' + idx);
  if (el) el.remove();
  state.photos[idx] = null;
  updateCounter();
}

async function uploadPhoto(photo, idx) {
  if (!state.contNo) return;

  var badge = document.getElementById('badge-' + idx);
  if (badge) { badge.textContent = 'Đang upload'; badge.className = 'status-badge status-uploading'; }

  var today = new Date();
  var dd = String(today.getDate()).padStart(2,'0');
  var mm = String(today.getMonth()+1).padStart(2,'0');
  var yyyy = today.getFullYear();
  var dateStr = dd + mm + yyyy;

  try {
    var res = await apiPost({
      action:       'uploadImage',
      container_no: state.contNo,
      carrier:      state.carrier,
      loai_anh:     state.loaiAnh,
      date_str:     dateStr,
      file_name:    photo.name,
      base64:       photo.base64,
      mime_type:    photo.mime
    });

    if (res.success) {
      if (badge) { badge.textContent = '✓ Xong'; badge.className = 'status-badge status-done'; }
      photo.status = 'done';
      // Hiện drive link
      if (res.folder_url) {
        var driveDiv = document.getElementById('drive-link');
        document.getElementById('drive-link-a').href = res.folder_url;
        driveDiv.style.display = 'block';
      }
    } else {
      if (badge) { badge.textContent = '✗ Lỗi'; badge.className = 'status-badge status-error'; }
      photo.status = 'error';
      toast('Lỗi upload: ' + (res.error || 'Unknown'));
    }
  } catch(e) {
    if (badge) { badge.textContent = '✗ Lỗi'; badge.className = 'status-badge status-error'; }
    photo.status = 'error';
    toast('Lỗi kết nối: ' + e.message);
  }
}
</script>
